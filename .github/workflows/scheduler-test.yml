name: Scheduler Smoke Test

on:
  schedule:
    # CLEAN SCHEDULER REGISTRATION TEST
    # GitHub Actions cron uses UTC.
    # Runs at minute 07,17,27,37,47,57 every hour.
    - cron: "7,17,27,37,47,57 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-smoke-test
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm scheduler execution
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "GITHUB SCHEDULER SMOKE TEST"
          echo "========================================"
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "========================================"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ TRUE SCHEDULED RUN"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ℹ️ MANUAL TEST RUN"
          else
            echo "⚠️ Unexpected event: ${{ github.event_name }}"
          fi

          echo "✅ Scheduler smoke test completed"
