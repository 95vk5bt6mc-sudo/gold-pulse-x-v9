name: Scheduler Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-smoke-test
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm manual workflow execution
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "GITHUB SCHEDULER SMOKE TEST"
          echo "========================================"
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "========================================"

          echo "ℹ️ Automatic scheduling is handled by Cloudflare Cron."
          echo "✅ Manual GitHub Actions test completed"
