name: GOLD PULSE Server Scan

on:
   workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-pulse-server-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate secrets
        env:
          GOLD_PULSE_URL: ${{ secrets.GOLD_PULSE_URL }}
          GOLD_PULSE_API_SECRET: ${{ secrets.GOLD_PULSE_API_SECRET }}
        run: |
          test -n "$GOLD_PULSE_URL" || (echo "Missing GOLD_PULSE_URL" && exit 1)
          test -n "$GOLD_PULSE_API_SECRET" || (echo "Missing GOLD_PULSE_API_SECRET" && exit 1)

      - name: Scan XAU/USD and evaluate LINE alert
        env:
          GOLD_PULSE_URL: ${{ secrets.GOLD_PULSE_URL }}
          GOLD_PULSE_API_SECRET: ${{ secrets.GOLD_PULSE_API_SECRET }}
        run: |
          BASE="${GOLD_PULSE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 2 --max-time 55 \
            -H "x-gold-pulse-secret: $GOLD_PULSE_API_SECRET" \
            "$BASE/api/scan"
