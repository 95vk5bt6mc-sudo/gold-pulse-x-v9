name: GOLD PULSE Server Scan

on:
  # Manual scan only.
  # Automatic scheduling is handled by Cloudflare Cron.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-pulse-server-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate secrets
        env:
          GOLD_PULSE_URL: ${{ secrets.GOLD_PULSE_URL }}
          GOLD_PULSE_API_SECRET: ${{ secrets.GOLD_PULSE_API_SECRET }}
        run: |
          set -Eeuo pipefail

          test -n "$GOLD_PULSE_URL" || {
            echo "ERROR: Missing GOLD_PULSE_URL"
            exit 1
          }

          test -n "$GOLD_PULSE_API_SECRET" || {
            echo "ERROR: Missing GOLD_PULSE_API_SECRET"
            exit 1
          }

          echo "✅ Required secrets are configured"

      - name: Manual XAU/USD scan and LINE evaluation
        env:
          GOLD_PULSE_URL: ${{ secrets.GOLD_PULSE_URL }}
          GOLD_PULSE_API_SECRET: ${{ secrets.GOLD_PULSE_API_SECRET }}
        run: |
          set -Eeuo pipefail

          BASE="${GOLD_PULSE_URL%/}"

          echo "========================================"
          echo "GOLD PULSE MANUAL SERVER SCAN"
          echo "========================================"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Endpoint: $BASE/api/scan"

          RESPONSE_FILE="$(mktemp)"

          cleanup() {
            rm -f "$RESPONSE_FILE"
          }

          trap cleanup EXIT

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 2 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 10 \
              --max-time 55 \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              -H "Accept: application/json" \
              -H "Cache-Control: no-cache" \
              -H "x-gold-pulse-secret: $GOLD_PULSE_API_SECRET" \
              "$BASE/api/scan"
          )"

          echo "HTTP status: $HTTP_STATUS"

          if [ -s "$RESPONSE_FILE" ]; then
            echo "Response:"
            cat "$RESPONSE_FILE"
            echo
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ GOLD PULSE manual scan failed"
            exit 1
          fi

          echo "✅ GOLD PULSE manual scan completed"
          echo "========================================"
